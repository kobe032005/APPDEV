<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Student Directory</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-mark">C</div>
      <div class="brand-name">Campus<br />Desk</div>
      <nav aria-label="Main navigation">
        <button class="nav-item active" type="button" data-view="Students" aria-label="Students" title="Students">&#9632;</button>
      </nav>
      <button class="sidebar-footer" type="button" id="help-button" aria-label="Help">?</button>
    </aside>

    <main class="main-content" id="directory">
      <header class="topbar">
        <div>
          <p class="eyebrow">College administration</p>
          <h1>Students <span id="student-count" class="count-badge">0</span></h1>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" id="notification-button" type="button" aria-label="Notifications" title="Notifications">&#128276;</button>
          <button class="profile-avatar" id="profile-button" type="button" aria-label="Open administrator profile">AD</button>
          <div class="popover hidden" id="notification-popover">No new notifications</div>
        </div>
      </header>

      <section class="directory-toolbar" aria-label="Student directory controls">
        <label class="search-box" for="student-search">
          <span>&#9906;</span>
          <input type="search" id="student-search" placeholder="Search students" />
        </label>
        <label class="filter-box" for="status-filter">Status
          <select id="status-filter">
            <option value="All">All students</option>
            <option value="Active">Active</option>
            <option value="On Leave">On Leave</option>
            <option value="Graduated">Graduated</option>
            <option value="Inactive">Inactive</option>
          </select>
        </label>
        <button type="button" id="toggle-form-button" class="primary-button">+ Add a student</button>
      </section>

      <section class="form-section hidden" id="student-form-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Student profile</p>
            <h2>Add / Edit Student</h2>
          </div>
          <button type="button" id="close-form-button" class="close-button" aria-label="Close student form">&times;</button>
        </div>
      <form id="record-form">
        <input type="hidden" id="record-id" />

        <div class="form-grid">
          <div>
            <label for="student-id">Student ID</label>
            <input type="text" id="student-id" name="studentId" placeholder="e.g. STU-2026-001" required />
          </div>

          <div>
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter student's full name" required />
          </div>

          <div>
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="student@example.com" required />
          </div>

          <div>
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="e.g. 555-0100" required />
          </div>

          <div>
            <label for="course">Course Name</label>
            <select id="course" name="course" required>
              <option value="">Select course</option>
              <option value="BSCS">BSCS - Bachelor of Science in Computer Science</option>
              <option value="BSIS">BSIS - Bachelor of Science in Information Systems</option>
              <option value="BLIS">BLIS - Bachelor of Library and Information Science</option>
              <option value="Others">Others</option>
            </select>
            <input type="text" id="custom-course" class="hidden" name="customCourse" placeholder="Type course name" />
          </div>

          <div>
            <label for="course-code">Course Code</label>
            <input type="text" id="course-code" name="courseCode" placeholder="e.g. CS101" required />
          </div>

          <div>
            <label for="year-level">Year Level</label>
            <select id="year-level" name="yearLevel" required>
              <option value="">Select year</option>
              <option value="1st Year">1st Year</option>
              <option value="2nd Year">2nd Year</option>
              <option value="3rd Year">3rd Year</option>
              <option value="4th Year">4th Year</option>
              <option value="Graduate">Graduate</option>
            </select>
          </div>

          <div>
            <label for="section">Section</label>
            <input type="text" id="section" name="section" placeholder="e.g. A" required />
          </div>

          <div>
            <label for="enrollment-date">Enrollment Date</label>
            <input type="date" id="enrollment-date" name="enrollmentDate" required />
          </div>

          <div>
            <label for="status">Status</label>
            <select id="status" name="status" required>
              <option value="Active">Active</option>
              <option value="On Leave">On Leave</option>
              <option value="Graduated">Graduated</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>

          <div class="full-width">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" placeholder="Enter student's address" required />
          </div>
        </div>

        <div class="button-row">
          <button type="submit" id="save-button">Save Student</button>
          <button type="button" id="cancel-button" class="secondary">Cancel</button>
        </div>
      </form>
        <p id="message" class="message"></p>
      </section>

      <section class="table-section">
        <div class="section-heading directory-heading">
          <div>
            <p class="eyebrow">All enrolled learners</p>
            <h2>Student directory</h2>
          </div>
          <span id="visible-count" class="visible-count">0 students</span>
        </div>
      <div class="table-wrapper">
        <table id="records-table">
          <thead>
            <tr>
              <th>Student ID</th>
              <th>Student</th>
              <th>Course Name</th>
              <th>Course Code</th>
              <th>Phone</th>
              <th>Year / Section</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="records-body"></tbody>
        </table>
      </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
